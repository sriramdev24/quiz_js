<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Game</title>
</head>
<body>
    <div class="container">
        <div class="question">
            <h1 id="qwd">What is the Captital</h1>
        </div>
        <div class="options">
           
        </div>
        <button class="next">Next</button>
        <button class="prev">Prev</button>

    </div>
</body>
</html>
<style>
    body{
        margin:0;
        padding:0;
        font-family: Verdana, Geneva, Tahoma, sans-serif;
           width:100%;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
    }
    .container{
       border:1px solid black;
       padding:20px 30px 30px 30px;
       width:50%;
       height: 87%;
    }
    .options{
        display: flex;
        flex-direction: column;
        gap:20px;

        
    }
    .options .question-box{
        border:1px solid rgb(7, 7, 53);
        padding:5px 5px 5px;
        padding-left: 20px;
        cursor: pointer;
    }
    .options .question-box:hover{
        background-color: rgb(175, 77, 7);
        color:white;
        border:none;
    }
    .container .next {
        margin-top: 20px;
        border:none;
        outline:none;
        background-color: black;
        color:white;
        width:35%;
        padding:10px 10px 10px;
        height:12%;
        cursor: pointer;
    }
    .container .prev {
        margin-top: 20px;
        border:none;
        outline:none;
        background-color: rgb(94, 71, 71);
        color:#fff;
        width:35%;
        padding:10px 10px 10px;
        height:12%;
        cursor: pointer;
        display: none;
    
    }
    .container .next:hover{
        background:transparent;
        color:black;
        border:1px solid black;
    }

    .container .options  .selected{
        background-color: rgb(175, 77, 7);
        color:white;
        border:none;
    }
</style>
<script>
   const Questions = [
    {
        "title": "What is the largest ocean on Earth?",
        "options": [
            ["Atlantic Ocean", false],
            ["Indian Ocean", false],
            ["Pacific Ocean", true],
            ["Arctic Ocean", false]
        ]
    },
    {
        "title": "What is the chemical symbol for pure water?",
        "options": [
            ["CO2", false],
            ["H2O", true],
            ["O2", false],
            ["NaCl", false]
        ]
    },
    {
        "title": "In the movie Frozen, who has magical ice and snow powers?",
        "options": [
            ["Ariel", false],
            ["Cinderella", false],
            ["Moana", false],
            ["Elsa", true]
        ]
    },
    {
        "title": "How many legs does a typical adult spider have?",
        "options": [
            [6, false],
            [4, false],
            [8, true],
            [10, false]
        ]
    },
    {
        "title": "In which European country would you find the Eiffel Tower?",
        "options": [
            ["Italy", false],
            ["France", true],
            ["Spain", false],
            ["Germany", false]
        ]
    }
];


let nextBtn = document.querySelector(".next")
let current = 0;
let prevbtn = document.querySelector(".prev")
nextBtn.addEventListener("click" , function(){
    if(current>Questions.length-1){
        ShowQuestion([])
    }
    else{
       if(current>0){
        prevbtn.style.display = 'inline';
       }
       else{
        prevbtn.style.display = 'none';
       }
         ShowQuestion(Questions[current])
          current++;
    } 
    
})


prevbtn.addEventListener("click" , function(){
    current-=1
    if(current<0){
        current=0
    }
    ShowQuestion(Questions[current])
})
let Score = 0;
let qwd = document.getElementById("qwd")
let options = document.querySelector(".options")
function ShowQuestion(obj){
    options.innerHTML = ''
    
    if(obj.length==0){
        qwd.innerText = ''
        options.innerHTML = `Your Total Score is ${Score}`;
        nextBtn.innerHTML = 'Retake'
        current=0;
    }
    else{
    qwd.innerText = obj.title;
   for(let i=0; i<obj.options.length; i++){
       let div = document.createElement("div")
       div.classList.add("question-box")
       let h3 = document.createElement("h3")
       h3.innerText = obj.options[i][0];
       div.addEventListener("click" , function(){
         RemoveSeletectedBefore()
         div.classList.add("selected")
         if (obj.options[i][0] && obj.options[i][1] == true){
            Score+=1
         }
         
       })
       div.appendChild(h3)
       options.appendChild(div);
   }
    }
   
}

function RemoveSeletectedBefore(){
    let qb = options.querySelectorAll(".question-box")
    qb.forEach(ele=>{
        
        if(ele.classList[1] == 'selected'){
            ele.classList.remove("selected")
        }
    })
}


window.onload = function(){
    ShowQuestion(Questions[0])
}
</script>
